<!--
  The demo's web page (main.py serves it at /; the Gradio chat is at /gradio as a fallback). Three views, one file:
    /               end users: the answer, its source, and "the data behind the answer" folded under it (?open=1 opens it)
    /?view=demo     the presentation: the route panel on the right (each step, purple = model, yellow = code), data open
    /?debug=1       development: the presentation plus every model call (raw reply, seconds) and pipeline step in
                    order, fallbacks, rows of tables that didn't answer, and the raw JSON
  One file, no build step, nothing loaded from the internet: it must work on venue Wi-Fi through an SSH tunnel.
  Every number on the page comes from the API's JSON; the browser only lays it out (and writes numbers with the
  reader's separators). Text from the API is always inserted with textContent, never as HTML, so an answer that
  contains markup is shown as text instead of running in the page.
-->
<style>

// newline-separated JSON from the server: {"skref": line} as each step happens, then {"svar": the answer}
async function stream(path, body, onStep) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify(body), signal: ctl.signal });
    if (res.status === 422) throw new Error("bad");
    if (!res.ok || !res.body) throw new Error("server");
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const event = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (event.skref) onStep(event.skref);
        if (event.svar) return event.svar;
      }
    }
    throw new Error("server");
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "timeout" : ["bad", "server"].includes(e.message) ? e.message : "net");
  } finally { clearTimeout(timer); }
}

async function post(path, body) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify(body), signal: ctl.signal });
    if (res.status === 422) throw new Error("bad");
    if (!res.ok) throw new Error("server");
    return await res.json();
  } catch (e) {
    throw new Error(e.name === "AbortError" ? "timeout" : ["bad", "server"].includes(e.message) ? e.message : "net");
  } finally { clearTimeout(timer); }
}

    const hgt = (H - top - bottom) * Math.abs(v) / max, x = left + i * slot + (slot - bw) / 2, y = H - bottom - hgt;
    el("rect", { x, y, width: bw, height: Math.max(1, hgt), rx: 2, fill: "var(--accent)" });
    if (i % step === 0 || i === n - 1) el("text", { x: x + bw / 2, y: H - 8, "text-anchor": "middle" }, g.merki[i]);
    if (i === 0 || i === n - 1 || v === Math.max(...g.gildi)) el("text", { x: x + bw / 2, y: y - 6, "text-anchor": "middle", class: "v" }, num(v, lang));
  });
  return h("div", { class: "chart" }, svg, g.eining ? h("p", { class: "hint", style: "margin:2px 0 0" }, g.eining) : null);
}

// "Is it still the newest figure?": the server reads the same cells live from PX-Web and compares
function stillCurrent(b, srcs) {
  const L = t(), said = h("p", { class: "hint", style: "white-space:pre-line" });
  const tables = srcs.filter((s) => s.px_slóð && !s.önnur_tafla).map((s) => ({ tafla: s.tafla, px_slóð: s.px_slóð,
    útgáfa: s.útgáfa, val: s.val, gildi: (s.gögn || []).map((r) => r.value) }));
  if (!tables.length) return said;
  const btn = h("button", { type: "button", class: "secondary" }, L.stillBtn);
  btn.addEventListener("click", async () => {
    btn.disabled = true; said.textContent = L.stillBusy;
    try { said.textContent = (await post("/enn_nyjast", { tungumál: ansLang(b), töflur: tables })).svar; }
    catch (e) { said.textContent = { timeout: L.errTimeout, server: L.errServer }[e.message] || L.errNet; }
    finally { btn.disabled = false; }
  });
  return h("div", { class: "second" }, btn, said);
}

function rowLabel(row) { return Object.entries(row).filter(([k]) => k !== "value").map(([, v]) => v).join(", "); }
function tableTitle(s, lang) { return (lang === "en" && s.titill_en) || s.titill; }
function uniq(xs) { return [...new Set(xs)]; }

// --- the route (right): the steps in pipeline order; purple = language model, yellow = code ------------------
function step(kind, head, ...body) {
  return h("li", { class: kind }, h("div", { class: "step-h" }, head), body.length ? h("div", { class: "step-b" }, ...body) : null);
}

function routePanel(r) {
  const bs = blocks(r);
  const parts = bs.map((b, i) => {
    const list = h("ol", { class: "steps" }, routeSteps(b));
    return bs.length > 1 ? [h("p", { class: "route-q" }, fill(t().st.partOf, { i: i + 1, n: bs.length }), ": ", b.spurning), list] : list;
  });
  $("steps").replaceChildren(...parts.flat());
}

function routeSteps(b) {
  const S = t().st, lang = ansLang(b), srcs = b.heimildir || [], out = [];
  if (b.síun) {
    const why = t().why[b.síun] || b.síun;
    out.push(step("stop", S.stopped, `${why.charAt(0).toUpperCase()}${why.slice(1)}. ${S.stoppedB}`));
    return out;
  }
  if (b.villa) return out;
  out.push(step("code", S.door, S.doorOk));
  if (b.athugun_líkans) out.push(step("llm", S.scope, S.scopeOk));
  const mains = srcs.filter((s) => !s.önnur_tafla);
  if (mains.length > 1) out.push(step("llm", S.split, h("ol", { class: "cands" }, mains.map((s, i) => h("li", {}, h("span", { class: "r" }, `${i + 1}.`), s.undirspurning || "")))));
  if (!srcs.length) {
    const found = b.leit_án_töflu || [];
    if (found.length) out.push(step("code", S.search, S.searchB, cands(found, lang)));
    out.push(step("code", S.noTable));
    return out;
  }
  srcs.forEach((s, i) => {
    if (s.önnur_tafla) { out.push(step("code", `${t().also}: ${s.tafla}`, tableTitle(s, lang))); return; }
    const sub = srcs.filter((x) => !x.önnur_tafla).length > 1 ? ` (${i + 1})` : "";
    const found = s.leit || [];
    const chosen = found.find((c) => c.chosen);
    const note = chosen && chosen.rank > 5 ? fill(S.rankNote, { r: chosen.rank }) : chosen && chosen.rank === null ? S.outside : null;
    out.push(step("code", S.search + sub, S.searchB, cands(found.filter((c) => c.rank !== null && c.rank <= 5), lang), note ? h("div", {}, note) : null));
    out.push(step("llm", `${S.pick}: ${s.tafla}`, tableTitle(s, lang)));
    // the model's choices; values code filled in because the question didn't name them are listed apart
    const byCode = new Set((s.forsendur || []).map((a) => a.breyta));
    const chose = (s.val_merkt || []).filter((v) => !byCode.has(v.breyta)).map((v) => `${v.breyta}: ${v.gildi.join(", ")}`);
    const filled = (s.forsendur || []).map((a) => `${a.breyta}: ${a.gildi}`);
    out.push(step("llm", S.values, h("div", { class: "tags" }, chose.map((c) => h("span", {}, c))),
      filled.length ? h("div", { style: "margin-top:6px" }, S.codeChose, " ", filled.join(" · ")) : null));
    const rows = b.svar_með_tölum === false && VIEW !== "dev" ? [] : s.gögn || [];  // rows that didn't answer it
    out.push(step("code", S.read, h("table", {}, h("tbody", {}, rows.slice(0, 6).map((row) =>
      h("tr", {}, h("td", {}, rowLabel(row)), h("td", { class: "n" }, `${shownValue(row.value, s, lang)}${s.eining ? " " + s.eining : ""}`)))))));
    if ((s.frávik || []).length) out.push(step("code", S.fallback, s.frávik.join(" · ")));
    if (s.útreikningur) out.push(step("code", S.calc, S.calcB, " ", s.útreikningur));
  });
  if (b.útreikningur_milli_taflna) out.push(step("code", S.calc, S.calcB, " ", b.útreikningur_milli_taflna));
  out.push(step("llm", S.answer + (b.líkan ? ` (${b.líkan})` : ""), S.answerB));
  if (b.tölur_athugaðar !== null && b.tölur_athugaðar !== undefined)
    out.push(step(b.tölur_athugaðar ? "code" : "stop", S.verify, b.tölur_athugaðar ? S.verifyOk : S.verifyBad));
  return out;
}

function cands(found, lang) {
  return h("ol", { class: "cands" }, found.map((c) => h("li", { class: c.chosen ? "pick" : null },
    h("span", { class: "r" }, `${c.rank}.`), `${c.id} `, h("span", { class: "t" }, (lang === "en" && c.title_en) || c.title_is || ""),
    c.chosen ? h("span", {}, " ✓", h("span", { class: "sr" }, " (valin)")) : null)));
}

// --- the developer view (?debug=1): what happened, in order, unpolished -----------------------------------------
// Labels here are in English only: it is for us, not for the audience.
function devPanel(r) {
  const dev = $("dev");
  dev.hidden = VIEW !== "dev";
  if (VIEW !== "dev") return;
  const bs = blocks(r);
  dev.replaceChildren(h("h2", {}, "?debug=1"), h("div", { class: "legend" }, h("span", { class: "l" }, "model call"), h("span", { class: "c" }, "code step")));
  dev.append(h("h3", {}, "Front door"), h("div", { class: "kv" },
    h("span", {}, `guard: ${r.síun || "ok"}`), h("span", {}, `language: ${r.tungumál || "?"}`),
    h("span", {}, `LLM topic check: ${r.athugun_líkans ? "passed" : "not run / stopped"}`),
    r.spurning_á_ensku ? h("span", {}, `asked in English: ${r.spurning_á_ensku}`) : null,
    h("span", {}, `${num(r.sekúndur, "en")} s total`)));
  bs.forEach((b, i) => {
    const srcs = b.heimildir || [];
    if (bs.length > 1) dev.append(h("h3", {}, `Question ${i + 1}: ${b.spurning}`));
    if (srcs.length) dev.append(h("h3", {}, "Sub-questions and tables"), h("ol", { class: "cands" }, srcs.map((s) => h("li", {},
      `${s.undirspurning || "(the question)"} → ${s.tafla} [${s.útgáfa}]`,
      (s.frávik || []).length ? h("pre", {}, "fallbacks: " + s.frávik.join("\n")) : null))));
    if (b.svar_með_tölum === false && srcs.length) dev.append(h("h3", {}, "Rows read from tables that did NOT answer (hidden from users)"),
      ...srcs.map((s) => h("pre", {}, `${s.tafla}\n` + (s.gögn || []).slice(0, 20).map((row) => `  ${rowLabel(row)}: ${row.value}`).join("\n"))));
  });
  const log = r.ferill || [];
  if (log.length) dev.append(h("h3", {}, "Steps in order (seconds since the start)"), h("ol", { class: "steps" }, log.map((e) =>
    h("li", { class: e.hver === "líkan" ? "llm" : "code" },
      h("div", { class: "step-h" }, h("span", { class: "t" }, `+${e.t.toFixed(2)} s  `), e.skref,
        e.líkan ? h("span", { class: "t" }, `  ${e.líkan}`) : null,  // which model answered this call
        e.sekúndur !== undefined ? h("span", { class: "t" }, `  (${e.sekúndur.toFixed(2)} s)`) : null),
      h("pre", {}, e.hver === "líkan" ? e.svar : JSON.stringify(e.upplýsingar))))));
  dev.append(h("details", {}, h("summary", {}, "Raw JSON from the API"), h("pre", {}, JSON.stringify(r, null, 1))));
}

// --- wiring ------------------------------------------------------------------------------------------------
// a new conversation: the next question is not read as a follow-up of the last one
$("fresh").addEventListener("click", () => {
  previous = null; last = null; $("fresh").hidden = true; $("q").value = ""; $("q").focus();
  start(); $("dev").replaceChildren();
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); });
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { ui = b.dataset.lang; labels(); }));
document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
setView(VIEW);
fetch("/health").then((r) => r.json()).then((h) => { secondModel = !!h.second_model; if (last) render(last); }).catch(() => {});
labels();
</script>
</body>
